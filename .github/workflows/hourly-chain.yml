name: WikiMasters — garantie horaire

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: wikimasters-pulls
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev
      - run: npm start
        env:
          CHROME_PATH: /usr/bin/google-chrome
          WIKIMASTERS_EMAIL: ${{ secrets.WIKIMASTERS_EMAIL }}
          WIKIMASTERS_PASSWORD: ${{ secrets.WIKIMASTERS_PASSWORD }}

  schedule-next:
    needs: run
    if: always()
    environment: hourly-delay
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Déclencher la prochaine exécution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/hourly-chain.yml/dispatches" \
            -d '{"ref":"main"}'

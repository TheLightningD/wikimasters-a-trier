name: WikiMasters — ouvrir et trier

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/live.yml
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      collection_only:
        description: "Contrôler uniquement la collection"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: wikimasters-live
  cancel-in-progress: false

jobs:
  ouverture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci --omit=dev

      - name: Vérifier Chrome
        run: test -x /usr/bin/google-chrome

      - name: Ouvrir les boosters et trier la collection
        run: npm start
        env:
          CHROME_PATH: /usr/bin/google-chrome
          WIKIMASTERS_EMAIL: ${{ secrets.WIKIMASTERS_EMAIL }}
          WIKIMASTERS_PASSWORD: ${{ secrets.WIKIMASTERS_PASSWORD }}
          COLLECTION_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.collection_only }}
          WM_PRETTY_OUTPUT: "true"
          WM_MACHINE_OUTPUT: "false"

      - name: Publier les diagnostics en cas d’échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wikimasters-diagnostics-${{ github.run_id }}
          path: |
            failure.png
            failure.html
          if-no-files-found: ignore
          retention-days: 7

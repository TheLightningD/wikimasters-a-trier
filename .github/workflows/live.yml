name: WikiMasters — ouvrir et trier

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      collection_only:
        description: "Contrôler uniquement la collection"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: wikimasters-live
  cancel-in-progress: false

jobs:
  ouverture:
    # Cloudflare bloque durablement les adresses IP des runners GitHub hébergés.
    # Le runner Windows interactif réutilise le profil Chrome validé localement.
    runs-on: [self-hosted, windows, x64, wikimasters]
    timeout-minutes: 40
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Préparer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        shell: powershell
        run: npm.cmd ci --omit=dev

      - name: Vérifier les prérequis locaux
        shell: powershell
        run: |
          $credentials = Join-Path $env:LOCALAPPDATA 'WikiMasters-A-Trier\credentials.xml'
          if (-not (Test-Path $credentials)) {
            throw 'Identifiants locaux absents. Lancez ouvrir-et-trier.cmd une fois avec le même compte Windows.'
          }

      - name: Ouvrir les boosters et trier la collection
        shell: powershell
        run: |
          if ('${{ inputs.collection_only }}' -eq 'true') {
            .\wishlist-local.ps1 -Full -CollectionOnly
          } else {
            .\wishlist-local.ps1 -Full
          }

      - name: Publier les diagnostics en cas d’échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wikimasters-diagnostics-${{ github.run_id }}
          path: |
            failure.png
            failure.html
          if-no-files-found: ignore
          retention-days: 7

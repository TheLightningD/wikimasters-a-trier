name: WikiMasters — validation du script

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: wikimasters-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Préparer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        id: install
        run: npm ci --omit=dev

      - name: Vérifier Chrome
        id: browser
        run: test -x /usr/bin/google-chrome

      - name: Vérifier le script de bout en bout
        id: tests
        run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Publier le bilan
        if: always()
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          TRIGGER: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [[ "$INSTALL_OUTCOME" != "success" ]]; then
            RESULT="Échec"
            CAUSE="L'installation des dépendances a échoué."
          elif [[ "$BROWSER_OUTCOME" != "success" ]]; then
            RESULT="Échec"
            CAUSE="Google Chrome est absent du runner GitHub."
          elif [[ "$TEST_OUTCOME" != "success" ]]; then
            RESULT="Échec"
            CAUSE="La suite de tests a échoué. Consultez l'étape « Vérifier le script de bout en bout »."
          else
            RESULT="Succès"
            CAUSE="Tous les scénarios automatisés sont validés."
          fi

          {
            echo "## WikiMasters — $RESULT"
            echo
            echo "| Élément | Valeur |"
            echo "| --- | --- |"
            echo "| Installation | $INSTALL_OUTCOME |"
            echo "| Chrome | $BROWSER_OUTCOME |"
            echo "| Tests | $TEST_OUTCOME |"
            echo "| Déclencheur | $TRIGGER |"
            echo "| Commit | \`${COMMIT_SHA:0:12}\` |"
            echo "| Bilan | $CAUSE |"
            echo
            echo "> L'ouverture réelle des boosters est exécutée par le workflow live avec une session chiffrée et renouvelée automatiquement."
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$RESULT" == "Succès" ]]; then
            echo "::notice title=WikiMasters validé::$CAUSE"
          else
            echo "::error title=Validation WikiMasters en échec::$CAUSE"
          fi

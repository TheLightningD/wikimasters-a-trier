name: WikiMasters — ouvrir et étiqueter

on:
  schedule:
    # Deux créneaux hors pointe limitent l'effet d'un run planifié retardé ou abandonné par GitHub.
    - cron: "7,37 * * * *"
    - cron: "17 3 1 * *"
  workflow_dispatch:
    inputs:
      collection_only:
        description: "Parcourir uniquement la collection sans ouvrir de paquet"
        required: false
        default: false
        type: boolean


permissions:
  contents: read

concurrency:
  group: wikimasters-pulls
  cancel-in-progress: false

jobs:
  run:
    if: github.event.schedule != '17 3 1 * *'
    runs-on: ubuntu-latest
    # Le délai couvre aussi l'attente d'un runner GitHub hébergé.
    timeout-minutes: 45
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Check Node.js
        run: node -e "if (+process.versions.node.split('.')[0] < 20) process.exit(1)"
      - run: npm ci --omit=dev
      - run: npm start
        env:
          CHROME_PATH: /usr/bin/google-chrome
          WIKIMASTERS_EMAIL: ${{ secrets.WIKIMASTERS_EMAIL }}
          WIKIMASTERS_PASSWORD: ${{ secrets.WIKIMASTERS_PASSWORD }}
          COLLECTION_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.collection_only }}

  keepalive:
    if: github.event.schedule == '17 3 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%F > .github/keepalive
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/keepalive
          git commit -m "keep scheduled workflow active"
          git push

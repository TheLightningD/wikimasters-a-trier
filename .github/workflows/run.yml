name: WikiMasters — ouvrir et étiqueter

on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "7 */6 * * *"
    - cron: "17 3 1 * *"
  workflow_dispatch:
    inputs:
      collection_only:
        description: "Parcourir uniquement la collection sans ouvrir de paquet"
        required: false
        default: false
        type: boolean


permissions:
  contents: read

concurrency:
  group: wikimasters-pulls
  cancel-in-progress: false

jobs:
  run:
    if: github.event.schedule != '17 3 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev
      - run: npm start
        env:
          CHROME_PATH: /usr/bin/google-chrome
          WIKIMASTERS_EMAIL: ${{ secrets.WIKIMASTERS_EMAIL }}
          WIKIMASTERS_PASSWORD: ${{ secrets.WIKIMASTERS_PASSWORD }}
          COLLECTION_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.collection_only }}
          SCAN_COLLECTION: ${{ inputs.collection_only || github.event.schedule == '7 */6 * * *' }}

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic
          path: |
            failure.png
            failure.html

  keepalive:
    if: github.event.schedule == '17 3 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%F > .github/keepalive
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/keepalive
          git commit -m "keep scheduled workflow active"
          git push

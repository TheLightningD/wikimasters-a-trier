<!doctype html>
<html lang="fr" data-wm-test="1" data-wm-mode="collection">
<head><meta charset="utf-8"></head>
<body>
  <h1>Collection</h1>
  <button id="select">Sélectionner</button>
  <main id="cards">
    <div class="relative isolate group"><div class="cursor-pointer"><strong>Sans étiquette 1</strong></div><span class="selection-indicator"></span></div>
    <div class="relative isolate group" data-case="other-only"><div class="cursor-pointer"><strong>Déjà classée</strong><span class="rounded-full">favori</span></div><span class="selection-indicator"></span></div>
    <div class="relative isolate group"><div class="cursor-pointer"><strong>Sans étiquette 2</strong></div><span class="selection-indicator"></span></div>
    <div class="relative isolate group" data-case="target-only"><div class="cursor-pointer"><strong>À trier seulement</strong><span class="rounded-full">à trier</span></div><span class="selection-indicator"></span></div>
    <div class="relative isolate group" data-case="target-other"><div class="cursor-pointer"><strong>Classée</strong><span class="rounded-full">à trier</span><span class="rounded-full">favori</span></div><span class="selection-indicator"></span></div>
    <div class="relative isolate group" data-case="target-others"><div class="cursor-pointer"><strong>Multi-classée</strong><span class="rounded-full">à trier</span><span class="rounded-full">favori</span><span class="rounded-full">rare</span></div><span class="selection-indicator"></span></div>
  </main>
  <button id="next" hidden>Suivant</button>
  <footer hidden>
    <button id="all">Tout sélectionner (page)</button>
    <button id="tag" disabled>Étiqueter</button>
  </footer>
  <script>
    const cards = [...document.querySelectorAll('.relative.isolate.group')];
    const allLabeled = new URLSearchParams(location.search).has('all-labeled');
    if (allLabeled) cards.filter(card => !card.querySelector('.rounded-full')).forEach(card => card.querySelector('.cursor-pointer').insertAdjacentHTML('beforeend', '<span class="rounded-full">favori</span>'));
    const cardList = document.querySelector('#cards');
    cards.forEach(card => card.remove());
    setTimeout(() => cardList.append(...cards), 800);
    const tag = document.querySelector('#tag');
    const refresh = () => { tag.disabled = !cards.some(card => card.dataset.selected === 'true'); };
    document.querySelector('#select').onclick = () => {
      if (/Quitter/.test(document.querySelector('#select').textContent)) {
        document.querySelector('footer').hidden = true;
        document.querySelector('#select').textContent = 'Sélectionner';
        return;
      }
      setTimeout(() => {
        document.querySelector('footer').hidden = false;
        document.querySelector('#select').textContent = 'Quitter la sélection';
      }, 800);
    };
    if (allLabeled) {
      const next = document.querySelector('#next');
      next.hidden = false;
      next.onclick = () => {
        if (!document.querySelector('footer').hidden) {
          document.querySelector('footer').hidden = true;
          document.querySelector('#select').textContent = 'Sélectionner';
          return;
        }
        cardList.prepend(cards[1]);
        next.disabled = true;
      };
    }
    const labels = card => [...card.querySelectorAll('.rounded-full')].map(item => item.textContent.trim());
    window.__cleanupSnapshot = () => Object.fromEntries(cards.filter(card => card.dataset.case).map(card => [card.dataset.case, labels(card)]));
    cards.forEach(card => card.querySelector('.cursor-pointer').onclick = () => {
      if (document.documentElement.dataset.wmMode === 'cleanup') {
        const modal = document.createElement('div');
        modal.className = 'details';
        modal.innerHTML = `${labels(card).map(value => `<button aria-label="Retirer l'étiquette ${value}">${value}</button>`).join('')}<button aria-label="Fermer">×</button>`;
        document.body.append(modal);
        modal.querySelectorAll('button')[labels(card).findIndex(value => value === 'à trier')]?.addEventListener('click', event => {
          if (new URLSearchParams(location.search).has('failure') && card.dataset.case === 'target-other') return;
          card.querySelectorAll('.rounded-full').forEach(item => { if (item.textContent.trim() === 'à trier') item.remove(); });
          event.currentTarget.remove();
        });
        modal.querySelector('[aria-label="Fermer"]').onclick = () => modal.remove();
        return;
      }
      if (document.querySelector('footer').hidden) return;
      card.dataset.selected = card.dataset.selected === 'true' ? 'false' : 'true';
      refresh();
    });
    tag.onclick = () => {
      const modal = document.createElement('div');
      modal.innerHTML = '<h2>Appliquer une étiquette</h2><input placeholder="Chercher ou créer une étiquette…"><button>à trier</button>';
      document.body.append(modal);
      modal.querySelector('button').onclick = () => {
        const selected = cards.filter(card => card.dataset.selected === 'true');
        modal.innerHTML = `<p>0 carte étiquetée. (${selected.length} déjà étiquetées)</p><button id="done">Terminé</button>`;
        modal.querySelector('#done').onclick = () => {
          selected.forEach(card => {
            card.querySelector('.cursor-pointer').insertAdjacentHTML('beforeend', '<span class="rounded-full">à trier</span>');
            card.dataset.selected = 'false';
          });
          modal.remove(); refresh();
        };
      };
    };
  </script>
</body>
</html>

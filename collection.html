<!doctype html>
<html lang="fr" data-wm-test="1" data-wm-mode="collection">
<head><meta charset="utf-8"></head>
<body>
  <h1>Collection</h1>
  <button id="select">Sélectionner</button>
  <main id="cards">
    <div class="relative isolate group"><div class="cursor-pointer"><strong>Sans étiquette 1</strong></div><span class="selection-indicator"></span></div>
    <div class="relative isolate group" data-case="other-only"><div class="cursor-pointer"><strong>Déjà classée</strong><span class="rounded-full">favori</span></div><span class="selection-indicator"></span></div>
    <div class="relative isolate group"><div class="cursor-pointer"><strong>Sans étiquette 2</strong></div><span class="selection-indicator"></span></div>
    <div class="relative isolate group" data-case="target-only"><div class="cursor-pointer"><strong>À trier seulement</strong><span class="rounded-full">à trier</span></div><span class="selection-indicator"></span></div>
    <div class="relative isolate group" data-case="target-other"><div class="cursor-pointer"><strong>Classée</strong><span class="rounded-full">à trier</span><span class="rounded-full">favori</span></div><span class="selection-indicator"></span></div>
    <div class="relative isolate group" data-case="target-others"><div class="cursor-pointer"><strong>Multi-classée</strong><span class="rounded-full">à trier</span><span class="rounded-full">favori</span><span class="rounded-full">rare</span></div><span class="selection-indicator"></span></div>
    <div class="relative isolate group" data-case="osef-card"><div class="cursor-pointer"><img alt="Canard colvert"><strong>Canard colvert</strong><span class="rounded-full">Osef</span><span class="rounded-full">échange · AncienPseudo2</span><span class="rounded-full">échange · AncienPseudo</span></div><span class="selection-indicator"></span></div>
    <div class="relative isolate group" data-case="not-osef-card"><div class="cursor-pointer"><img alt="Montagne"><strong>Montagne</strong><span class="rounded-full">favori</span></div><span class="selection-indicator"></span></div>
  </main>
  <button id="next-decoy" hidden>Suivant</button><button id="next" hidden>Suivant</button>
  <footer hidden>
    <button id="all">Tout sélectionner (page)</button>
    <button id="tag" disabled>Étiqueter</button>
  </footer>
  <script>
    const cards = [...document.querySelectorAll('.relative.isolate.group')];
    const params = new URLSearchParams(location.search);
    const allLabeled = params.has('all-labeled');
    if (allLabeled) cards.filter(card => !card.querySelector('.rounded-full')).forEach(card => card.querySelector('.cursor-pointer').insertAdjacentHTML('beforeend', '<span class="rounded-full">favori</span>'));
    const cardList = document.querySelector('#cards');
    cards.forEach(card => card.remove());
    setTimeout(() => cardList.append(...cards), 800);
    const tag = document.querySelector('#tag');
    const refresh = () => { tag.disabled = !cards.some(card => card.dataset.selected === 'true'); };
    document.querySelector('#select').onclick = () => {
      if (/Quitter/.test(document.querySelector('#select').textContent)) {
        document.querySelector('footer').hidden = true;
        document.querySelector('#select').textContent = 'Sélectionner';
        return;
      }
      setTimeout(() => {
        document.querySelector('footer').hidden = false;
        document.querySelector('#select').textContent = 'Quitter la sélection';
      }, 800);
    };
    if (allLabeled) {
      const next = document.querySelector('#next');
      document.querySelector('#next-decoy').hidden = false;
      next.hidden = false;
      next.onclick = () => {
        if (!document.querySelector('footer').hidden) {
          document.querySelector('footer').hidden = true;
          document.querySelector('#select').textContent = 'Sélectionner';
          return;
        }
        cardList.prepend(cards[1]);
        document.querySelector('#next-decoy').disabled = true;
        next.disabled = true;
      };
    }
    const labels = card => [...card.querySelectorAll('.rounded-full')].map(item => item.textContent.trim());
    const detailLabels = card => card.dataset.detailLabels ? JSON.parse(card.dataset.detailLabels) : labels(card);
    const setDetailLabels = (card, values) => { card.dataset.detailLabels = JSON.stringify(values); };
    if (params.has('details-only-labels')) {
      const card = cards.find(item => item.dataset.case === 'osef-card');
      setDetailLabels(card, labels(card));
      [...card.querySelectorAll('.rounded-full')].filter(item => item.textContent.startsWith('échange · ')).forEach(item => item.remove());
    }
    window.__cleanupSnapshot = () => Object.fromEntries(cards.filter(card => card.dataset.case).map(card => [card.dataset.case, detailLabels(card)]));
    cards.forEach(card => card.querySelector('.cursor-pointer').onclick = () => {
      if (!document.querySelector('footer').hidden) {
        card.dataset.selected = card.dataset.selected === 'true' ? 'false' : 'true';
        refresh();
        return;
      }
      if (['cleanup', 'inventory', 'wishlist-apply'].includes(document.documentElement.dataset.wmMode)) {
        const modal = document.createElement('div');
        modal.className = 'details';
        modal.innerHTML = `${detailLabels(card).map(value => `<button aria-label="Retirer l'étiquette ${value}">${value}</button>`).join('')}<button aria-label="Fermer">×</button>`;
        document.body.append(modal);
        [...modal.querySelectorAll('button')].slice(0, -1).forEach(button => button.addEventListener('click', event => {
          const value = event.currentTarget.textContent.trim();
          if (new URLSearchParams(location.search).has('failure') && card.dataset.case === 'target-other' && value === 'à trier') return;
          card.querySelectorAll('.rounded-full').forEach(item => { if (item.textContent.trim() === value) item.remove(); });
          setDetailLabels(card, detailLabels(card).filter(label => label !== value));
          event.currentTarget.remove();
        }));
        modal.querySelector('[aria-label="Fermer"]').onclick = () => modal.remove();
        return;
      }
    });
    const availableLabels = new Set(['à trier']);
    window.__createdLabels = [];
    tag.onclick = () => {
      const modal = document.createElement('div');
      modal.innerHTML = '<h2>Appliquer une étiquette</h2><input placeholder="Chercher ou créer une étiquette…">';
      document.body.append(modal);
      if (document.documentElement.dataset.wmMode === 'wishlist-apply') {
        const input = modal.querySelector('input');
        const nativeValue = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
        Object.defineProperty(input, 'value', { configurable: true, get: () => nativeValue.get.call(input), set: () => {} });
      }
      const apply = label => {
        const selected = cards.filter(card => card.dataset.selected === 'true');
        let applied = 0;
        let already = 0;
        selected.forEach(card => {
          if (detailLabels(card).includes(label)) { already++; return; }
          setDetailLabels(card, [...detailLabels(card), label]);
          if (document.documentElement.dataset.wmMode !== 'wishlist-apply') {
            const badge = document.createElement('span');
            badge.className = 'rounded-full';
            badge.textContent = label;
            card.querySelector('.cursor-pointer').append(badge);
          }
          applied++;
        });
        modal.innerHTML = `<p>${applied} carte${applied === 1 ? '' : 's'} étiquetée${applied === 1 ? '' : 's'}. (${already} déjà étiquetées)</p><button id="done">Terminé</button>`;
        modal.querySelector('#done').onclick = () => {
          selected.forEach(card => {
            card.dataset.selected = 'false';
          });
          modal.remove(); refresh();
        };
      };
      for (const value of availableLabels) {
        const option = document.createElement('button');
        option.textContent = value;
        option.onclick = () => apply(value);
        modal.append(option);
      }
      modal.querySelector('input').oninput = event => {
        modal.querySelector('[data-create]')?.remove();
        const value = event.target.value.trim();
        if (!value) return;
        const create = document.createElement('button');
        create.dataset.create = 'true';
        create.textContent = `Créer « ${value} »`;
        create.onclick = () => {
          if (!availableLabels.has(value)) window.__createdLabels.push(value);
          availableLabels.add(value);
          apply(value);
        };
        modal.append(create);
      };
    };
  </script>
</body>
</html>

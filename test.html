<!doctype html>
<html lang="fr" data-wm-test="1">
<head>
  <meta charset="utf-8">
  <title>Test WikiMasters — À trier</title>
  <style>
    body{font:16px system-ui;background:#101218;color:#eee;padding:30px}button{padding:10px;margin:6px}.pack-card{cursor:pointer;border:1px solid #555;border-radius:10px;padding:40px;margin:10px;width:220px}.badge{color:#7ee787}dialog{background:#222;color:#fff;border:1px solid #777}
  </style>
</head>
<body>
  <h1>Faux écran WikiMasters</h1>
  <main id="app"><p>Chargement…</p></main>
  <output id="result">En attente</output>
  <script>
    const app = document.querySelector('#app');
    let pack = 0;
    let card = 0;

    const showCard = () => {
      app.innerHTML = `<p>Carte ${card + 1} / 3</p><article class="pack-card cursor-pointer"><strong>Carte ${pack * 3 + card + 1}</strong></article>`;
      document.querySelector('.pack-card').onclick = () => {
        const dialog = document.createElement('dialog');
        dialog.setAttribute('role', 'dialog');
        dialog.innerHTML = '<button role="combobox">Ajouter une étiquette…</button>';
        document.body.append(dialog);
        dialog.showModal();
        dialog.querySelector('[role="combobox"]').onclick = () => {
          dialog.insertAdjacentHTML('beforeend', '<div role="listbox"><button role="option">à trier</button><button role="option">Keep</button></div>');
          dialog.querySelector('[role="option"]').onclick = () => {
            dialog.close(); dialog.remove();
            card++;
            if (card < 3) {
              app.innerHTML = `<button id="more">Encore ${3 - card} carte(s)</button>`;
              document.querySelector('#more').onclick = showCard;
            } else {
              app.innerHTML = '<button id="continue">Continuer</button>';
              document.querySelector('#continue').onclick = () => { pack++; card = 0; showPack(); };
            }
          };
        };
      };
    };

    const showPack = () => {
      if (pack >= 2) { app.innerHTML = '<p>Tous les packs sont ouverts.</p>'; return; }
      app.innerHTML = '<button id="open">Ouvrir</button>';
      document.querySelector('#open').onclick = showCard;
    };

    setTimeout(showPack, 300);
    document.addEventListener('wm-tri-finished', event => {
      document.querySelector('#result').textContent = JSON.stringify(event.detail);
    });
  </script>
  <script src="content.js"></script>
</body>
</html>

<!doctype html>
<html lang="fr" data-wm-test="1">
<head>
  <meta charset="utf-8">
  <title>Test WikiMasters — À trier</title>
  <style>
    body{font:16px system-ui;background:#101218;color:#eee;padding:30px}button,input{padding:10px;margin:6px}.pack-card{cursor:pointer;border:1px solid #555;border-radius:10px;padding:40px;margin:10px;width:220px}dialog{background:#222;color:#fff;border:1px solid #777}
  </style>
</head>
<body>
  <h1>Faux écran WikiMasters</h1>
  <main id="app"><p>Chargement…</p></main>
  <output id="result">En attente</output>
  <script>
    const app = document.querySelector('#app');
    let pack = 0;
    let card = 0;
    let transitioning = false;
    const dailyLimit = new URLSearchParams(location.search).has('limit');
    const pullError = new URLSearchParams(location.search).has('pull-error');
    const persistentNext = new URLSearchParams(location.search).has('persistent-next');
    const delayedNext = new URLSearchParams(location.search).has('delayed-next');
    const challenge = new URLSearchParams(location.search).has('challenge');
    const loginStuck = new URLSearchParams(location.search).has('login-stuck');
    const cloudflare = new URLSearchParams(location.search).has('cloudflare');
    const quickCheck = new URLSearchParams(location.search).has('quick-check');
    const tagged = Array(6).fill(false);
    window.__verifiedCount = 0;

    const showCard = () => {
      const index = pack * 3 + card;
      const action = card < 2
        ? `<button id="next-card"><svg><polyline points="9 18 15 12 9 6"></polyline></svg></button><button id="more" disabled>Encore ${2 - card} carte(s)</button>`
        : '<button id="continue">Continuer</button>';
      app.innerHTML = `<p>Carte ${card + 1} / 3</p><article class="pack-card cursor-pointer"><strong>Carte ${index + 1}</strong></article>${action}`;
      document.querySelector('.pack-card').onclick = () => {
        if (transitioning) { app.innerHTML = '<p>Ancienne carte retraitée pendant la transition</p>'; return; }
        const actionButton = document.querySelector('#next-card,#continue');
        actionButton.disabled = true;
        const dialog = document.createElement('dialog');
        dialog.innerHTML = '<button aria-label="Fermer">×</button>' + (tagged[index]
          ? '<button aria-label="Retirer l’étiquette à trier">à trier</button>'
          : '<input placeholder="Ajouter une étiquette…">');
        document.body.append(dialog);
        dialog.showModal();
        dialog.querySelector('[aria-label="Fermer"]').onclick = () => { dialog.close(); dialog.remove(); actionButton.disabled = false; };
        if (tagged[index]) {
          window.__verifiedCount++;
          return;
        }
        const input = dialog.querySelector('input');
        input.onkeydown = event => {
          if (event.key !== 'ArrowDown') return;
          const portal = document.createElement('div');
          portal.innerHTML = '<ul role="listbox"><li role="option" aria-selected="true"><button class="label-option">à trier</button></li><li role="option"><button>Keep</button></li></ul>';
          document.body.append(portal);
          portal.querySelector('.label-option').onclick = () => {
            tagged[index] = true;
            window.__verifiedCount++;
            portal.remove();
            input.replaceWith(Object.assign(document.createElement('button'), {
              textContent: 'à trier',
              ariaLabel: 'Retirer l’étiquette à trier'
            }));
          };
        };
      };
      document.querySelector('#next-card')?.addEventListener('click', event => {
        const persistentButton = persistentNext ? event.currentTarget : null;
        const advance = () => {
          card++;
          transitioning = false;
          showCard();
          const replacement = document.querySelector('#next-card');
          if (persistentButton && replacement) replacement.replaceWith(persistentButton);
        };
        if (delayedNext) {
          transitioning = true;
          event.currentTarget.disabled = true;
          setTimeout(advance, 500);
        } else {
          advance();
        }
      });
      document.querySelector('#continue')?.addEventListener('click', () => { pack++; card = 0; showPack(); });
    };

    const showPack = () => {
      if (pack >= 2) { app.innerHTML = '<p>Tous les packs sont ouverts.</p>'; return; }
      app.innerHTML = '<button id="open">Ouvrir</button>';
      if (quickCheck && !pack) {
        const verification = document.createElement('section');
        verification.id = 'quick-check';
        verification.innerHTML = '<p>Vérification rapide</p><label><input type="checkbox">Je ne suis pas un robot</label><button>Continuer</button>';
        app.prepend(verification);
        setTimeout(() => verification.remove(), 1500);
      }
      const openAction = pullError && pack ? () => { app.innerHTML = '<p>Erreur technique pendant l’ouverture.</p>'; } : dailyLimit && pack ? () => { setTimeout(() => { app.innerHTML = '<p>Limite quotidienne de paquets atteinte.</p>'; }, 1000); } : showCard;
      document.querySelector('#open').onclick = () => {
        if (document.querySelector('#quick-check')) { app.innerHTML = '<p>Ouverture refusée avant la vérification rapide.</p>'; return; }
        openAction();
      };
    };

    const showLogin = () => {
      const validation = cloudflare
        ? '<p>Cloudflare Vérification…</p>'
        : `<div role="dialog"><p>Confirmer une action sans rapport</p><button id="unsafe-confirm">Confirmer</button></div><div role="dialog"><p>Validation requise avant l'ouverture des paquets</p><button id="validate">Valider</button></div>`;
      app.innerHTML = `<button id="login-decoy" type="button">Connexion</button><form><label>Adresse courriel<input type="email"></label><label>Mot de passe<input type="password"></label><button id="login" type="submit" disabled>Connexion</button></form>${validation}`;
      if (!cloudflare) {
        document.querySelector('#unsafe-confirm').onclick = () => { app.innerHTML = '<p>Action indésirable confirmée</p>'; };
        document.querySelector('#validate').onclick = event => {
          event.currentTarget.closest('[role="dialog"]').remove();
          document.querySelector('#login').disabled = false;
        };
      }
      document.querySelector('form').onsubmit = event => { event.preventDefault(); if (!loginStuck) setTimeout(showPack, 500); };
    };

    setTimeout(challenge ? showLogin : showPack, 300);
    document.addEventListener('wm-tri-finished', event => {
      document.querySelector('#result').textContent = JSON.stringify(event.detail);
    });
  </script>
  <script src="content.js"></script>
</body>
</html>

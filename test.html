<!doctype html>
<html lang="fr" data-wm-test="1">
<head>
  <meta charset="utf-8">
  <title>Test WikiMasters — À trier</title>
  <style>
    body{font:16px system-ui;background:#101218;color:#eee;padding:30px}button,input{padding:10px;margin:6px}.pack-card{cursor:pointer;border:1px solid #555;border-radius:10px;padding:40px;margin:10px;width:220px}dialog{background:#222;color:#fff;border:1px solid #777}
  </style>
</head>
<body>
  <h1>Faux écran WikiMasters</h1>
  <main id="app"><p>Chargement…</p></main>
  <output id="result">En attente</output>
  <script>
    const app = document.querySelector('#app');
    let pack = 0;
    let card = 0;
    const tagged = Array(6).fill(false);
    window.__verifiedCount = 0;

    const showCard = () => {
      const index = pack * 3 + card;
      const action = card < 2
        ? `<button id="more">Encore ${2 - card} carte(s)</button>`
        : '<button id="continue">Continuer</button>';
      app.innerHTML = `<p>Carte ${card + 1} / 3</p><article class="pack-card cursor-pointer"><strong>Carte ${index + 1}</strong></article>${action}`;
      document.querySelector('.pack-card').onclick = () => {
        const dialog = document.createElement('dialog');
        dialog.setAttribute('role', 'dialog');
        dialog.innerHTML = '<button aria-label="Fermer">×</button>' + (tagged[index]
          ? '<button aria-label="Retirer l’étiquette à trier">à trier</button>'
          : '<input placeholder="Ajouter une étiquette…">');
        document.body.append(dialog);
        dialog.showModal();
        dialog.querySelector('[aria-label="Fermer"]').onclick = () => { dialog.close(); dialog.remove(); };
        if (tagged[index]) {
          window.__verifiedCount++;
          return;
        }
        const input = dialog.querySelector('input');
        input.onkeydown = event => {
          if (event.key !== 'ArrowDown') return;
          const portal = document.createElement('div');
          portal.innerHTML = '<button class="label-option" aria-selected="true">à trier</button><button>Keep</button>';
          document.body.append(portal);
          portal.querySelector('.label-option').onclick = () => {
            tagged[index] = true;
            portal.remove();
            dialog.close(); dialog.remove();
          };
        };
      };
      document.querySelector('#more')?.addEventListener('click', () => { card++; showCard(); });
      document.querySelector('#continue')?.addEventListener('click', () => { pack++; card = 0; showPack(); });
    };

    const showPack = () => {
      if (pack >= 2) { app.innerHTML = '<p>Tous les packs sont ouverts.</p>'; return; }
      app.innerHTML = '<button id="open">Ouvrir</button>';
      document.querySelector('#open').onclick = showCard;
    };

    setTimeout(showPack, 300);
    document.addEventListener('wm-tri-finished', event => {
      document.querySelector('#result').textContent = JSON.stringify(event.detail);
    });
  </script>
  <script src="content.js"></script>
</body>
</html>
